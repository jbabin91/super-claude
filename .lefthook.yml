# Lefthook configuration file
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/

output:
  - failure # Only show failed steps
  - execution_out # Show command output for failures

pre-commit:
  parallel: true
  commands:
    audit:
      run: bun audit --audit-level moderate
    typecheck:
      glob: '*.{ts,tsx}'
      run: bunx @jbabin91/tsc-files {staged_files}
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: bunx eslint {staged_files} --fix
      stage_fixed: true
    lint-md:
      glob: '*.md'
      run: bunx markdownlint-cli2 {staged_files} --fix
      stage_fixed: true
    format:
      glob: '*.{ts,tsx,js,jsx,cjs,mjs,json,md,mdx,yml,yaml}'
      run: bunx prettier -uw {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit "$1"
