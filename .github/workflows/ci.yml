name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run markdown linting
        run: bun run lint:md

      - name: Run TypeScript/JavaScript linting
        run: bun run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type checking
        run: bun run typecheck

  validate-schemas:
    name: Validate Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate JSON schemas
        run: bun run validate

  # Summary job that depends on all other jobs
  # This provides a single check to require in branch protection
  # and prevents auto-merge from triggering while checks are in progress
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, validate-schemas]
    if: always()
    steps:
      - name: Check Workflow Status
        run: |
          # Helper function to fail on specific job results
          exit_on_result() {
            if [[ "$2" == "failure" ]]; then
              echo "❌ Job '$1' failed"
              exit 1
            elif [[ "$2" == "cancelled" ]]; then
              echo "🚫 Job '$1' was cancelled"
              exit 1
            fi
          }

          # Create GitHub Step Summary
          echo "## 📊 CI Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Required |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | \`${{ needs.lint.result }}\` | ✅ Yes |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | \`${{ needs.type-check.result }}\` | ✅ Yes |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate Schemas | \`${{ needs.validate-schemas.result }}\` | ✅ Yes |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "🔍 Checking CI job results..."
          echo ""
          echo "📊 Job Results:"
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  Type Check: ${{ needs.type-check.result }}"
          echo "  Validate Schemas: ${{ needs.validate-schemas.result }}"
          echo ""

          # Required jobs (must not fail or be cancelled)
          exit_on_result "lint" "${{ needs.lint.result }}"
          exit_on_result "type-check" "${{ needs.type-check.result }}"
          exit_on_result "validate-schemas" "${{ needs.validate-schemas.result }}"

          echo "✅ All checks passed - safe to merge"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All checks passed** - safe to merge" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View full run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "✅ Required checks passed - ready for merge"
