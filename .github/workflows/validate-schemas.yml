name: validate-schemas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-schemas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate JSON schemas
        run: bun run validate
